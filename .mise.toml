[tools]
go = "1.26.5"
node = "24.19.0"
pnpm = "11.20.0"

[tasks]
# 開発用コマンド
dev = "pnpm dev"
start = "pnpm dev"

# ビルド関連
build = "pnpm build"
build-all = "pnpm build"
rebuild = "pnpm rebuild"
clean = "pnpm clean"

# 個別パッケージビルド
build-components = "pnpm --filter @boid-wasm-sim/components build"
build-wasm = "pnpm --filter @boid-wasm-sim/wasm build"
build-web = "pnpm --filter @boid-wasm-sim/web build:only"

# 開発用（個別パッケージ）
dev-components = "pnpm --filter @boid-wasm-sim/components dev"
dev-wasm = "pnpm --filter @boid-wasm-sim/wasm dev"
dev-web = "pnpm --filter @boid-wasm-sim/web dev"

# テスト関連
test = "pnpm test"
test-all = "pnpm test:all"
test-components = "pnpm --filter @boid-wasm-sim/components test"
test-wasm = "pnpm --filter @boid-wasm-sim/wasm test"
test-web = "pnpm --filter @boid-wasm-sim/web test"

# 型チェック・リント
typecheck = "pnpm typecheck"
lint = "pnpm lint"
lint-fix = "pnpm lint:fix"
format = "pnpm format:fix"
format-check = "pnpm format:check"
check = "pnpm check"
check-fix = "pnpm check:fix"

# プレビュー
preview = "pnpm preview"

# 依存関係管理
install = "pnpm install"
update = "pnpm update"

# CI用
ci-install = "pnpm install --frozen-lockfile"
ci-build = "pnpm build"
ci-test = "pnpm test:all"
ci-check = "pnpm typecheck && pnpm lint"

# GitHub Actions用
gh-setup = "mise install && pnpm install"
gh-test = "pnpm --filter @boid-wasm-sim/wasm test && pnpm --filter @boid-wasm-sim/hooks test && pnpm --filter @boid-wasm-sim/web test"
gh-build = "pnpm --filter @boid-wasm-sim/wasm build && pnpm --filter @boid-wasm-sim/hooks build && pnpm --filter @boid-wasm-sim/components build && pnpm --filter @boid-wasm-sim/web build"
gh-deploy = "cd web/main && VITE_BASE_PATH=/boid-wasm-sim/ pnpm build"

# セキュリティチェック
security-audit = "pnpm audit --audit-level moderate"
security-check = "pnpm audit"

[settings]
minimum_release_age = "7d"
