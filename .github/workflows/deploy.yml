name: Deploy to GitHub Pages

on:
  # CI(test/lint/build)が成功した場合のみデプロイする。
  # pushで直接トリガーすると、CIが赤のままの状態でも
  # デプロイが独立して走ってしまうため。
  workflow_run: # zizmor: ignore[dangerous-triggers] 自リポジトリの push 由来のみ build job の if で許可
    workflows: [ "CI" ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    name: Build for GitHub Pages
    runs-on: ubuntu-latest
    # workflow_dispatchでの手動実行、またはCIが成功した場合のみビルドする
    # workflow_run は fork からの PR でも発火し、head_branch はフォーク側のブランチ名
    # （fork の "main" ブランチも一致する）になるため、自リポジトリへの push 由来に限定する
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # workflow_runイベントはデフォルトでデフォルトブランチをcheckoutするため、
          # CIを成功させたコミット自体を明示的にcheckoutする
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # .mise.toml と同じ版に固定（latest だと公開直後の版を minimumReleaseAge なしで使ってしまう）
          version: 12.15.0
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build WASM module
        run: |
          pnpm --filter @boid-wasm-sim/wasm build
          # wasm_exec.jsをdistディレクトリにコピー
          cp wasm/wasm_exec.js web/main/public/ || echo "wasm_exec.js not found in wasm directory"
      
      - name: Build web packages
        run: |
          pnpm --filter @boid-wasm-sim/hooks build
          pnpm --filter @boid-wasm-sim/components build
      
      - name: Build web application for GitHub Pages
        run: |
          cd web/main
          VITE_BASE_PATH=/boid-wasm-sim/ pnpm build
        env:
          # GitHub Pagesのベースパスを設定（リポジトリ名に応じて調整）
          VITE_BASE_PATH: /boid-wasm-sim/
      
      - name: Verify build output
        run: |
          echo "Build output contents:"
          ls -la web/main/dist/
          echo "WASM files in dist:"
          ls -la web/main/dist/*.wasm || echo "No WASM files found in dist"
          echo "WASM files in public:"
          ls -la web/main/public/*.wasm || echo "No WASM files found in public"
          echo "wasm_exec.js:"
          ls -la web/main/dist/wasm_exec.js || echo "No wasm_exec.js found in dist"
      
      - name: Setup GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: './web/main/dist'

  deploy:
    permissions:
      pages: write
      id-token: write
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      
      - name: Display deployment URL
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "🚀 Deployment successful!"
          echo "📱 Live URL: ${PAGE_URL}"
          echo "✨ Boid simulation is now available online!"