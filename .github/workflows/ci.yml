name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [26]
        go-version: [1.27.3]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          # .mise.toml と同じ版に固定（latest だと公開直後の版を minimumReleaseAge なしで使ってしまう）
          version: 12.15.0
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Lint and format check
        run: |
          pnpm lint
          pnpm format:check
      
      - name: Build dependencies for type checking
        run: |
          pnpm --filter @boid-wasm-sim/hooks build
          pnpm --filter @boid-wasm-sim/components build
      
      - name: Type check
        run: pnpm typecheck
      
      - name: Run WASM tests (Core Logic)
        run: pnpm --filter @boid-wasm-sim/wasm test
      
      - name: Run TypeScript tests
        run: |
          pnpm --filter @boid-wasm-sim/hooks test
          pnpm --filter @boid-wasm-sim/components test
          pnpm --filter @boid-wasm-sim/web test
      
      - name: Build WASM module
        run: pnpm --filter @boid-wasm-sim/wasm build
      
      - name: Build web application
        run: |
          pnpm --filter @boid-wasm-sim/hooks build
          pnpm --filter @boid-wasm-sim/components build
          pnpm --filter @boid-wasm-sim/web build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: build-artifacts
          path: |
            web/main/dist/
            wasm/boid.wasm
          retention-days: 7

  security:
    name: Security Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          # .mise.toml と同じ版に固定（latest だと公開直後の版を minimumReleaseAge なしで使ってしまう）
          version: 12.15.0
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Security audit
        run: pnpm audit
        continue-on-error: true
      
      - name: Check for vulnerabilities
        run: |
          echo "Checking for known vulnerabilities..."
          pnpm audit --audit-level moderate || echo "Security audit completed with warnings"